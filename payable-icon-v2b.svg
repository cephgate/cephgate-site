<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7a3c"/>
      <stop offset="100%" style="stop-color:#0f9d58"/>
    </linearGradient>
  </defs>
  <!-- Green rounded background -->
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>
  <!-- Stylized P - stem (shifted left to make room for arrow) -->
  <rect x="18" y="16" width="8.5" height="56" rx="4" fill="white"/>
  <!-- P bowl -->
  <path d="M26.5 16 Q58 16 58 34 Q58 52 26.5 52" fill="none" stroke="white" stroke-width="8.5" stroke-linecap="round"/>
  <!-- P bowl inner cutout -->
  <path d="M26.5 27 Q47 27 47 34 Q47 41 26.5 41" fill="none" stroke="#0f9d58" stroke-width="6" stroke-linecap="round"/>
  <!-- Forward arrow - bottom right -->
  <!-- Shaft -->
  <line x1="58" y1="72" x2="79" y2="72" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polyline points="69,62 79,72 69,82" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
